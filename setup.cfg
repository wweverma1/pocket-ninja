[flake8]
exclude = 
    .git,
    __pycache__,
    venv,
    venv*,
    env,
    build,
    dist,
    *.egg-info,
    ./app/__init__.py
    ./app/utils/gemini_product_matching_helper.py
    ./app/utils/gemini_receipt_analysis_helper.py

max-line-length = 120
max-complexity = 10

per-file-ignores =
    app/product/controller.py: C901

show-source = True
statistics = True
count = True
